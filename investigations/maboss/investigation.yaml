schema_version: 2
name: maboss
title: "Showcase: viva-maboss — MaBoSS stochastic Boolean networks as a pluggable engine"
created: '2026-11-27'
status: running
question: >-
  Does viva-maboss expose the MaBoSS engine (cmaboss) as a process-bigraph process
  that advances a stochastic Boolean network one coupling interval at a time and
  emits ensemble on-probabilities — the Boolean layer for multiscale composites?
hypothesis: >-
  Wrapping MaBoSS as a process-bigraph process and running a two-node network
  (A activated by B, B repressed by A) should produce bounded, non-degenerate
  ensemble on-probabilities for both nodes that settle around 0.5 — the signature
  of the network's limit cycle — using the real cmaboss stochastic simulator.
description: >-
  viva-maboss bridges MaBoSS (via the compiled cmaboss backend) into process-bigraph
  as a process that advances a continuous-time Boolean network interval by interval,
  re-sampling the joint state and emitting per-node Boolean state and ensemble
  on-probability. This showcase proves the engine on a minimal two-node toggle
  network — the Boolean layer that plugs into multiscale composites (e.g.
  Boolean cell-fate coupled to kinetics and a spatial field).
studies:
- toggle-switch
executive:
  what_is_this: >-
    A demonstration that the MaBoSS stochastic Boolean-network simulator can be
    driven as a plug-in engine inside process-bigraph. It runs a tiny two-gene
    regulatory network and reports, interval by interval, the probability that
    each gene is ON across a stochastic ensemble.
  verdict: >-
    The toggle composite runs cmaboss end to end: both nodes' ensemble
    on-probabilities stay bounded in (0,1) and settle near 0.5 (A ~ 0.53,
    B ~ 0.52) over the run — the acceptance band met in a clean-venv run of the
    pinned engine.
  verdict_detail: >-
    Study toggle-switch: over a 30-interval run, the last-10-interval mean
    on-probabilities are A = 0.529 and B = 0.520, both inside [0.3, 0.7]; neither
    node locks to 0 or 1 (observed on viva-maboss 0.1.3 / cmaboss 1.0.0b34,
    2026-11-27). The A=B / B=!A logic makes this a 4-state limit cycle, so the
    bounded ~0.5 marginals are its signature — not bistability.
  decisions_needed: []
scientific_argument:
  main_claim: >-
    MaBoSS can be exposed as a reusable process-bigraph process that advances a
    stochastic Boolean network and emits real ensemble statistics, ready to be the
    Boolean layer of a multiscale composite.
  evidence_for:
  - >-
    Both nodes' ensemble on-probabilities remain bounded and non-degenerate and
    settle near 0.5, exactly as the network's 4-state cycle predicts.
  - >-
    The run is seed-reproducible and emits per-interval Boolean states alongside
    the marginals, so the process genuinely advances the cmaboss ensemble.
  evidence_against:
  - >-
    This is a toy two-node network chosen to exercise the bridge; it demonstrates
    the engine, not a biologically calibrated regulatory model.
  key_figures: []
  caveats:
  - >-
    The network's marginals reflect a limit cycle; an "anti-correlation" or
    bistability reading would be wrong for this specific logic.
acceptance_criteria:
- study: toggle-switch
  behavior: bounded-marginals
