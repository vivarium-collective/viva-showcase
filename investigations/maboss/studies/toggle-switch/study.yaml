schema_version: 4
name: toggle-switch
simulator:
  package: viva-maboss
  ref: "0.1.3"
  registry: git
title: Two-node Boolean network (MaBoSS / cmaboss)
created: '2026-11-27'
status: complete
execution_status: ran
phase: Decide
question: >-
  Driven as a process-bigraph process, does MaBoSS advance a two-node Boolean
  network and emit bounded, non-degenerate ensemble on-probabilities for both
  nodes?
hypothesis: >-
  Running the A-activated-by-B / B-repressed-by-A network through cmaboss,
  advancing one coupling interval at a time, yields ensemble on-probabilities that
  stay in (0,1) and settle near 0.5 for both nodes (the network's limit-cycle
  signature), with neither node locking to 0 or 1.
objective: >-
  Demonstrate end to end that viva_maboss.composites.toggle.maboss_toggle_switch
  runs the real MaBoSS engine and emits per-interval Boolean states and ensemble
  on-probabilities, with MaBoSS acting as a pluggable process-bigraph process.
description: >-
  The basic-functionality showcase for viva-maboss. A two-node MaBoSS network is
  advanced interval by interval by the cmaboss backend; each interval re-samples
  the joint state and emits each node's Boolean state and ensemble on-probability.
  Over a 30-interval run the last-10-interval mean on-probabilities are A = 0.529,
  B = 0.520 — both bounded in (0,1), the signature of the network's 4-state cycle.
baseline:
- name: baseline
  composite: viva_maboss.composites.toggle.maboss_toggle_switch
  params: {}
variants: []
expected_behavior:
- name: bounded-marginals
  en: >-
    Both nodes' ensemble on-probabilities stay bounded and non-degenerate —
    time-averaged over the run's tail, each settles inside [0.3, 0.7].
  observable: node_probabilities
  condition: averaged over the last 10 coupling intervals
  rationale: >-
    The A=B / B=!A logic is a 4-state limit cycle (00->01->11->10->...), whose
    stationary marginals sit near 0.5; a correct stochastic run must keep both
    nodes bounded away from the 0/1 locks.
  measure: {kind: derived_scalar, field: settle_A}
  expect: {op: '>=', value: 0.3}
behavior_tests:
- name: bounded-marginals
  classification: primary
  description: >-
    Tail-averaged on-probability of each node in [0.3, 0.7] (observed A = 0.529,
    B = 0.520 over the last 10 of 30 intervals; neither node locks to 0 or 1).
  measure: {kind: derived_scalar, field: settle_A}
  pass_if: {op: '>=', value: 0.3}
  requires_simulation: baseline
pipeline_gate:
  prerequisites: []
  enables: []
canonical_runs:
- name: default
  script: investigations/maboss/studies/toggle-switch/sims/run.py
  args: []
  label: toggle-switch
  default: true
visualizations: []
findings:
- name: bounded-cycling-marginals
  statement: >-
    Over a 30-interval run the two nodes' tail-averaged ensemble on-probabilities
    are A = 0.529 and B = 0.520, both bounded in (0,1) — the signature of the
    network's 4-state limit cycle, not bistability.
  provenance: >-
    Observed in an isolated-venv run of the toggle composite on viva-maboss 0.1.3
    / cmaboss 1.0.0b34, 2026-11-27 (reproduced by sims/run.py).
conclusion: >-
  PASS. Run as a process-bigraph process, MaBoSS advanced the two-node Boolean
  network and emitted bounded ensemble on-probabilities (A = 0.529, B = 0.520
  tail-averaged), with neither node locking to 0 or 1. MaBoSS behaves as a drop-in
  process-bigraph Boolean engine — the stochastic layer for multiscale composites.
