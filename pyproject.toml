[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-showcase"
version = "0.1.0"
description = "Showcase of the viva ecosystem's simulators — one investigation per simulator demonstrating basic functionality."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
  {name = "Eran Agmon", email = "agmon.eran@gmail.com"},
  {name = "Ryan Spangler"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pbg-artistoo",
    "poincare==1.1.*",
    "simbio==1.1.*",
    "viva-amici",
    "viva-caspule",
    "viva-comets",
    "viva-copasi==0.2.2",
    "viva-discovery-engine",
    "viva-equilibrator",
    "viva-fenics",
    "viva-grammar",
    "viva-lammps",
    "viva-maboss",
    "viva-medyan",
    "viva-mem3dg",
    "viva-reactive-system",
    "viva-readdy",
    "viva-simbio",
    "viva-tellurium==0.2.4",
    "viva-tstmd",
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-showcase"
Issues = "https://github.com/vivarium-collective/viva-showcase/issues"

# Metadata-only wheel: this repo is the showcase workspace and ships no importable
# package of its own (each simulator package lives in its own repo, installed from
# the pins above).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
pbg-artistoo = { git = "https://github.com/vivarium-collective/viva-artistoo.git", tag = "0.1.0" }
viva-amici = { git = "https://github.com/vivarium-collective/viva-amici.git", rev = "63ce10bff6ea38524726c810e83b84fcfecbe059" }
viva-caspule = { git = "https://github.com/vivarium-collective/viva-caspule.git", tag = "0.1.0" }
viva-comets = { git = "https://github.com/vivarium-collective/viva-comets.git", tag = "0.1.0" }
viva-discovery-engine = { git = "https://github.com/vivarium-collective/discovery-engine.git", branch = "main" }
viva-equilibrator = { git = "https://github.com/vivarium-collective/viva-equilibrator.git", tag = "v0.1.0" }
viva-fenics = { git = "https://github.com/vivarium-collective/viva-fenics.git", tag = "0.3.0" }
viva-grammar = { git = "https://github.com/vivarium-collective/viva-grammar.git", tag = "0.1.0" }
viva-lammps = { git = "https://github.com/vivarium-collective/viva-lammps.git", tag = "0.1.1" }
viva-maboss = { git = "https://github.com/vivarium-collective/viva-maboss.git", tag = "0.1.3" }
viva-medyan = { git = "https://github.com/vivarium-collective/viva-medyan.git", tag = "0.1.0" }
viva-mem3dg = { git = "https://github.com/vivarium-collective/viva-mem3dg.git", tag = "0.1.1" }
viva-reactive-system = { git = "https://github.com/vivarium-collective/viva-reactive-system.git", tag = "0.1.0" }
viva-readdy = { git = "https://github.com/vivarium-collective/viva-readdy.git", tag = "0.1.0" }
viva-simbio = { git = "https://github.com/vivarium-collective/viva-simbio.git", rev = "c43ecf0c465c729713f0cc8304927f71cee73312" }
viva-tstmd = { git = "https://github.com/vivarium-collective/viva-tstmd.git", tag = "0.1.0" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }

[tool.uv]
# vivarium-workbench caps viva-discovery-engine by semver policy; resolve DE from
# git main so this workspace tracks the current engine (matches the other viva
# workspaces).
override-dependencies = [
    "viva-discovery-engine @ git+https://github.com/vivarium-collective/discovery-engine.git@main",
]
